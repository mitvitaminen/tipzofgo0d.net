<section id="contact"
	class="flex flex_dir_column justify_center align_items_center fade">
	<h1>Kontaktformular</h1>
	<script src="https://web3forms.com/client/script.js" async defer></script>
	<script>
		const form = document.getElementById('form');

		form.addEventListener('submit', function(e) {

			const hCaptcha = form
					.querySelector('textarea[name=h-captcha-response]').value;

			if (!hCaptcha) {
				e.preventDefault();
				alert("Please fill out captcha field")
				return

			}
		});
	</script>
	<form method="post" action="https://api.web3forms.com/submit" id="form"
		class="ccform">
		<input type="hidden" name="access_key"
			value="2d71d514-8850-4117-937f-00583c5ff8d2"> <input
			type="hidden" name="redirect"
			value="https://www.croware.net/success.html"> <input
			type="checkbox" name="botcheck" class="hidden" style="display: none;">
		<div class="ccfield-prepend">
			<span class="ccform-addon"><i class="fa fa-user fa-2x"></i></span> <input
				name="name" class="ccformfield" type="text" placeholder="Full Name"
				required>
		</div>
		<div class="ccfield-prepend">
			<span class="ccform-addon"><i class="fa fa-envelope fa-2x"></i></span>
			<input name="email" class="ccformfield" type="text"
				placeholder="Email" required>
		</div>
		<div class="ccfield-prepend">
			<span class="ccform-addon"><i class="fa fa-mobile-phone fa-2x"></i></span>
			<input name="phone" class="ccformfield" type="text"
				placeholder="Phone">
		</div>
		<div class="ccfield-prepend">
			<span class="ccform-addon"><i class="fa fa-info fa-2x"></i></span> <input
				name="subject" class="ccformfield" type="text" placeholder="Subject"
				required>
		</div>
		<div class="ccfield-prepend">
			<span class="ccform-addon"><i class="fa fa-comment fa-2x"></i></span>
			<textarea class="ccformfield" name="comments" rows="8"
				placeholder="Message" required></textarea>
		</div>

		<div class="h-captcha" data-captcha="true"></div>
		<button type="submit">Submit Form</button>
	</form>
</section>
